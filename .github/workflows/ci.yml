name: CI

on:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure NuGet
        run: |
          dotnet nuget update source github \
            --username jocelynenglund \
            --password ${{ secrets.NUGET_AUTH_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test ChoreMonkey.IntegrationTests --configuration Release --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nestle-together/package-lock.json

      - name: Install dependencies
        working-directory: nestle-together
        run: npm ci

      - name: Build
        working-directory: nestle-together
        run: npm run build
        env:
          VITE_API_URL: https://itsybitsylist-api.azurewebsites.net

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    
    steps:
      - uses: actions/checkout@v4

      # Setup .NET for API
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure NuGet
        run: |
          dotnet nuget update source github \
            --username jocelynenglund \
            --password ${{ secrets.NUGET_AUTH_TOKEN }} \
            --store-password-in-clear-text

      - name: Restore .NET
        run: dotnet restore

      - name: Build API
        run: dotnet build ChoreMonkey.ApiService --configuration Release --no-restore

      # Setup Node for frontend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nestle-together/package-lock.json

      - name: Install frontend dependencies
        working-directory: nestle-together
        run: npm ci

      - name: Build frontend (pointing to local API)
        working-directory: nestle-together
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5536

      - name: Install Playwright
        working-directory: nestle-together
        run: npx playwright install --with-deps chromium

      # Start API in background, capture logs, and wait for /health to actually respond.
      # Replaces a fixed `sleep 10` that was racing with API startup on slower runners
      # and silently masking failures (`curl ... || echo skipped`).
      - name: Start API and wait for /health
        run: |
          mkdir -p api-logs
          dotnet run --project ChoreMonkey.ApiService --configuration Release --no-build \
            > api-logs/api.log 2>&1 &
          echo $! > api-logs/api.pid

          echo "Waiting for API on http://localhost:5536/health (up to 60s)..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5536/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat api-logs/api.pid)" 2>/dev/null; then
              echo "::error::API process exited before becoming healthy"
              tail -n 200 api-logs/api.log
              exit 1
            fi
            sleep 1
          done

          echo "::error::API did not become healthy within 60s"
          tail -n 200 api-logs/api.log
          exit 1
        env:
          ASPNETCORE_URLS: http://localhost:5536
          ASPNETCORE_ENVIRONMENT: Development

      - name: Run E2E tests (full local stack)
        working-directory: nestle-together
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4173

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: nestle-together/playwright-report/
          retention-days: 7

      - name: Upload API logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-logs
          path: api-logs/
          retention-days: 7
